china_ecosystem:
  - name: "CNKI (China National Knowledge Infrastructure)"
    url: "https://www.cnki.net/"
    role: "China equivalent PubMed+Scholar+ScienceDirect combined, #1 academic DB"
  - name: "SinoMed / CBM"
    url: "https://www.sinomed.ac.cn/"
    role: "PubMed analogue, 2500+ Chinese journals missed by West, operated by CAMS Institute of Medical Information"
  - name: "Wanfang Data"
    url: "https://www.wanfangdata.com.cn/"
    role: "CNKI competitor, med-tech patents + device trials"
  - name: "CMA Journals Platform"
    url: "https://journals.cma.org.cn/"
    role: "180+ top-tier journals, operative guideline gold standard"
  - name: "Medlive / Haoyisheng"
    url: "https://www.medlive.cn/"
    role: "surgical videos + guidelines + case discussion"

preprint_mapping:
  arxiv_scope: "physics/math/CS primary, q-bio only 10 categories, light screening, arXiv Inc nonprofit since 2026-07-01"
  why_not_medical: "no clinical-trials/surgery/pharma focus; error cost = patient harm vs broken code"
  medrxiv: "clinical medicine/epidemiology/public health, openRxiv nonprofit since 2025-03-11"
  biorxiv: "basic biology genetics/neuroscience/cell"
  mandates_2026: "HHMI preprint-before-submission Jan 2026, Gates Foundation since 2025"
